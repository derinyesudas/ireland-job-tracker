name: Rescue quarantined feeds

# One pass at the feeds the scraper has stopped calling. Looks for a reader and
# token that work, writes those into the tracked list, and stops. Run once.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be repaired, write nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rescue
  cancel-in-progress: true

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet cryptography

      - name: Unlock the research files
        env:
          TRACKER_KEY: ${{ secrets.TRACKER_KEY }}
        run: python scripts/vault.py open

      - name: Rescue
        env:
          DRY: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          [ "$DRY" = "true" ] && ARGS+=(--dry-run)
          python scripts/rescue.py --workers 6 "${ARGS[@]}" | tee rescue.log

      - name: Report
        if: always()
        run: |
          {
            echo "## Quarantined feeds, one pass"
            echo
            echo '```'
            sed -n '/^=\{20,\}/,$p' rescue.log 2>/dev/null || cat rescue.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Count the feeds while the file is still readable
        if: ${{ !inputs.dry_run }}
        run: echo "FEEDS=$(python -c "import json;print(len(json.load(open('data/companies.json'))))")" >> "$GITHUB_ENV"

      - name: Lock the research files again
        if: always()
        env:
          TRACKER_KEY: ${{ secrets.TRACKER_KEY }}
        run: python scripts/vault.py close

      - name: Commit the encrypted files
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "job-tracker-bot"
          git config user.email "job-tracker-bot@users.noreply.github.com"
          git add data/companies.json.enc data/feed_health.json.enc
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "companies: repair feeds the scraper had given up on ($FEEDS feeds live)"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Confirm nothing unlocked was left behind
        if: always()
        run: |
          git status --porcelain
          if git status --porcelain | grep -E '^\?\?.*(ireland_register|companies|resolution_report|site_inspection|seed_companies|feed_health|derin)\.json$'; then
            echo "::error::plaintext research left on disk"
            exit 1
          fi
          echo "clean - only encrypted files present"
