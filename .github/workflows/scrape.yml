name: Scrape jobs

# Runs every 15 minutes. This is free and unlimited because the repository is
# public - GitHub only bills Actions minutes on private repos.
#
# A note on timing: GitHub schedules these on a best-effort basis and can run
# late when their queues are busy, so treat "every 15 minutes" as "usually
# within 15-25 minutes". The workflow is also safe to trigger by hand from the
# Actions tab whenever you want an immediate check.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Scan every company instead of just this run's shard"
        type: boolean
        default: false

# Never let two scrapes run at once - they would fight over the data files.
concurrency:
  group: scrape
  cancel-in-progress: false

# The scrape publishes the site itself. It has to: a commit pushed with the
# built-in GITHUB_TOKEN deliberately does NOT trigger other workflows, so the
# "Deploy site" workflow never fired after a scrape and the live page sat on
# whatever data was there the last time someone pressed the button by hand.
# That is why the site showed forty companies while the repository held two
# hundred and fifty. Deploying here closes the loop.
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the encryption library
        run: pip install --quiet cryptography

      - name: Unlock the research files
        env:
          TRACKER_KEY: ${{ secrets.TRACKER_KEY }}
        run: python scripts/vault.py open

      - name: Run the scraper
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            python -m scraper.run --full
          else
            python -m scraper.run
          fi

      - name: Lock the research files again
        if: always()
        env:
          TRACKER_KEY: ${{ secrets.TRACKER_KEY }}
        run: python scripts/vault.py close

      - name: Commit any new jobs
        run: |
          git config user.name  "job-tracker-bot"
          git config user.email "actions@github.com"
          git add data/jobs.json data/stats.json data/feed_health.json.enc 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No change in the job list this run."
          else
            COUNT=$(python -c "import json;print(len(json.load(open('data/jobs.json'))))")
            git commit -m "jobs: refresh ($COUNT live)"
            # Another run may have pushed while we worked - rebase and retry.
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && break
              echo "push attempt $i failed, retrying"
              sleep 5
            done
          fi

  publish:
    needs: scrape
    runs-on: ubuntu-latest
    # Both this and the standalone "Deploy site" workflow target the same
    # environment, so they share a concurrency group and the newer wins.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # site/data is no longer committed - it is the same bytes as data/, and
      # carrying both doubled the repository's growth for no benefit. Build it
      # here instead, and fail loudly rather than publishing an empty board.
      - name: Stage the data the page reads
        run: |
          mkdir -p site/data
          python3 -c "import json,pathlib; \
            [pathlib.Path('site/data',n).write_text(json.dumps(json.load(open('data/'+n)),separators=(',',':')),encoding='utf-8') for n in ('jobs.json','stats.json')]"
          test -s site/data/jobs.json && test -s site/data/stats.json
          echo "staged $(python3 -c "import json;print(len(json.load(open('site/data/jobs.json'))))") jobs"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
