name: Deploy site

# Publishes the site/ folder to GitHub Pages. Runs whenever the site or its
# data changes, which means the live page picks up each new scrape.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the data the page reads
        run: |
          mkdir -p site/data
          python3 -c "import json,pathlib; \
            [pathlib.Path('site/data',n).write_text(json.dumps(json.load(open('data/'+n)),separators=(',',':')),encoding='utf-8') for n in ('jobs.json','stats.json')]"
          test -s site/data/jobs.json && test -s site/data/stats.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
