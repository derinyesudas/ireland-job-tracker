name: Deploy site

# Publishes the site/ folder to GitHub Pages. Runs whenever the site or its
# data changes, which means the live page picks up each new scrape.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the data the page reads
        run: |
          mkdir -p site/data
          # The page shows at most the first 2,200 characters of an advert, so that is all
          # it downloads (about 1.8 MB instead of 4 MB). The graduate filter reads the whole
          # advert, so its answer is worked out here first and shipped as grad_text.
          python3 - <<'PY'
          import json, pathlib, re
          grad = re.compile(r"graduate|intern|placement|trainee|entry[^\n\r\u2028\u2029]level|junior|early career|apprentice")
          jobs = json.load(open("data/jobs.json"))
          for j in jobs:
              d = j.get("description") or ""
              j["grad_text"] = bool(grad.search((j.get("title", "") + " " + d).lower()))
              if d: j["description"] = d[:2200]
          for name, data in (("jobs.json", jobs), ("stats.json", json.load(open("data/stats.json")))):
              pathlib.Path("site/data", name).write_text(json.dumps(data, separators=(",", ":")), encoding="utf-8")
          PY
          test -s site/data/jobs.json && test -s site/data/stats.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
