name: Rebuild company list

# Discovery is slow (it probes thousands of career feeds), so it runs weekly
# rather than every 15 minutes. It refreshes two things:
#   1. The government employment-permit register - who actually sponsors, and
#      how heavily.
#   2. Which applicant-tracking system each company hires through, so the
#      scraper knows where to look.

on:
  schedule:
    - cron: "0 4 * * 1"     # 04:00 UTC every Monday
  workflow_dispatch:
    inputs:
      limit:
        description: "How many top sponsors to probe"
        default: "600"
      min_permits:
        description: "Ignore companies with fewer permits than this"
        default: "1"
      cap:
        description: "Never grow the tracker beyond this many companies"
        default: "290"

permissions:
  contents: write

concurrency:
  group: discover

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the encryption library
        run: pip install --quiet cryptography

      - name: Unlock the research files
        env:
          TRACKER_KEY: ${{ secrets.TRACKER_KEY }}
        run: python scripts/vault.py open

      - run: pip install openpyxl

      - name: Find who hires and how
        run: |
          python scripts/build_companies.py \
            --limit ${{ inputs.limit || '1200' }} \
            --min-permits ${{ inputs.min_permits || '1' }}

      - name: Lock the research files again
        if: always()
        env:
          TRACKER_KEY: ${{ secrets.TRACKER_KEY }}
        run: python scripts/vault.py close

      - name: Commit the refreshed company list
        run: |
          git config user.name  "job-tracker-bot"
          git config user.email "actions@github.com"
          git add data/companies.json.enc data/permits_raw.json data/ats_discovery_cache.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Company list unchanged."
          else
            N=$(python -c "import json;print(len(json.load(open('data/companies.json'))))")
            git commit -m "companies: rebuild register ($N tracked)"
            git pull --rebase --autostash origin main
            git push origin main
          fi
