name: Probe branded careers sites

# Finds the tenant behind an employer's own branding. The resolver already
# notices that a page is "a platform behind branding"; this works out WHICH
# tenant, by reading the platform URLs out of the page and the scripts it
# loads, and then calling the feed to confirm real jobs come back.
#
# Reports only. It commits nothing, so there is nothing here that can leak the
# register: the findings go to the run summary and are read from there.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Only employers whose name contains this (blank = all untracked)"
        default: ""
      workers:
        description: "How many sites to open at once"
        default: "6"

permissions:
  contents: read

concurrency:
  group: probe

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the encryption library
        run: pip install --quiet cryptography

      - name: Unlock the research files
        env:
          TRACKER_KEY: ${{ secrets.TRACKER_KEY }}
        run: python scripts/vault.py open

      - name: Probe
        id: probe
        run: |
          python scripts/probe_platforms.py \
            --only "${{ inputs.only }}" \
            --workers ${{ inputs.workers || '6' }} | tee probe.log

      - name: Report
        if: always()
        run: |
          {
            echo "## Branded careers sites"
            echo
            python - <<'PY'
          import json, pathlib
          p = pathlib.Path("data/probe_results.json")
          if not p.exists():
              print("No results produced."); raise SystemExit
          rs = json.loads(p.read_text())

          hits    = [r for r in rs if r["working"]]
          tenant  = [r for r in rs if not r["working"] and r.get("platforms") and not r["tried"]]
          reader  = [r for r in rs if not r["working"] and r["tried"]]
          dead    = [r for r in rs if not r["working"] and not r["tried"]
                     and not r.get("platforms")]

          print(f"**{len(hits)} of {len(rs)} employers now return real jobs.**\n")
          print(f"- {len(hits)} ready to add")
          print(f"- {len(tenant)} name a platform but not the tenant")
          print(f"- {len(reader)} were readable but no reader could parse them")
          print(f"- {len(dead)} could not be opened at all\n")

          if hits:
              print("### Ready to add\n")
              print("| Employer | Reader | Token | What came back |")
              print("|---|---|---|---|")
              for r in hits:
                  w = r["working"][0]
                  print(f"| {r['name']} | {w['ats']} | `{w['token'][:70]}` | {w['note']} |")
              print()

          if tenant:
              print("### Platform seen, tenant hidden\n")
              print("| Employer | Platform | Best page |")
              print("|---|---|---|")
              for r in tenant:
                  print(f"| {r['name']} | {', '.join(r['platforms'])} | {r.get('best_url','')} |")
              print()

          if reader:
              print("### Readable, nothing parsed it\n")
              print("Links seen = what the probe counts. Reader keeps = what the "
                    "joblinks filter accepts. A wide gap means the filter is the "
                    "problem, not the site.\n")
              print("| Employer | Links seen | Reader keeps | Best page | Last thing tried |")
              print("|---|---|---|---|---|")
              for r in sorted(reader, key=lambda x: -x.get("links", 0)):
                  last = r["tried"][-1]
                  print(f"| {r['name']} | {r.get('links',0)} | {r.get('reader_links','?')} "
                        f"| {r.get('best_url','')} "
                        f"| `{last['reader']}` - {last['note'][:50]} |")
              print()
              gap = [r for r in reader
                     if r.get("links", 0) >= 3 and r.get("reader_links", 0) == 0]
              if gap:
                  print("#### The links the filter threw away\n")
                  for r in gap[:20]:
                      print(f"**{r['name']}** ({r.get('links',0)} seen, 0 kept)  ")
                      for u in r.get("samples", []):
                          print(f"- `{u}`  ")
                      print()

          if dead:
              print("### Could not be opened\n")
              print("| Employer | URL | Why |")
              print("|---|---|---|")
              for r in dead:
                  print(f"| {r['name']} | {r['url']} | {r.get('note','')[:70]} |")
              print()

          print("<details><summary>Every attempt, in full</summary>\n")
          for r in rs:
              print(f"\n**{r['name']}** - {r.get('links',0)} job links at {r.get('best_url','')}  ")
              if r.get("platforms"):
                  print(f"platforms named: {', '.join(r['platforms'])}  ")
              for t in r["tried"]:
                  mark = "OK" if t["ok"] else "no"
                  print(f"- {mark} `{t['reader']}` `{t['token']}` - {t['note']}  ")
              if not r["tried"]:
                  print(f"- nothing tried: {r.get('note','no candidate token or list page')}  ")
          print("\n</details>")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lock the research files again
        if: always()
        env:
          TRACKER_KEY: ${{ secrets.TRACKER_KEY }}
        run: python scripts/vault.py close

      - name: Confirm nothing unlocked was left behind
        if: always()
        run: |
          git status --porcelain
          if git status --porcelain | grep -E '^\?\?.*(ireland_register|companies|resolution_report|site_inspection|seed_companies|feed_health|derin)\.json$'; then
            echo "::error::plaintext research left on disk"
            exit 1
          fi
          echo "clean - only encrypted files present"
